[project]
name = "kd"
version = "0.1.0"
description = "Knowledge distillation na CIFAR-100: ResNet ucitelj, ResNet i ViT (DeiT) studenti"
readme = "README.md"
authors = [
    { name = "Pavle Dukic", email = "111158663+DjuraBetmen@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "torch>=2.15.0",
    "torchvision>=0.29.2",
]

[project.scripts]
kd = "kd:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
